services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ralph_cockpit
      POSTGRES_USER: ralph
      POSTGRES_PASSWORD: ralph
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cockpit-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ralph -d ralph_cockpit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ralph_cockpit
      DB_USERNAME: ralph
      DB_PASSWORD: ralph
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      RALPH_PROJECT_ROOT: /ralph-project
    volumes:
      - .:/app
      - ../..:/ralph-project:ro
    depends_on:
      postgres:
        condition: service_healthy

  reverb:
    build: .
    working_dir: /app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ralph_cockpit
      DB_USERNAME: ralph
      DB_PASSWORD: ralph
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cockpit-pg:
